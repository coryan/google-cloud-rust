[package]
name              = "pubsub-conformance-proxy"
description       = "Pub/Sub client library conformance test proxy."
version           = "0.0.0"
publish           = false
build             = "build.rs"
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
prost                 = { workspace = true, default-features = true }
prost-types           = { workspace = true, default-features = true }
tokio                 = { workspace = true, features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tonic                 = { workspace = true, default-features = true }
tonic-prost.workspace = true
tracing.workspace     = true
tracing-subscriber    = { workspace = true, features = ["fmt"] }
# Local dependencies
google-cloud-auth.workspace = true
google-cloud-gax.workspace  = true
google-cloud-pubsub         = { workspace = true, features = ["default"] }

[dev-dependencies]
tokio-stream = { workspace = true, features = ["net"] }

[build-dependencies]
tonic-prost-build = { workspace = true }
